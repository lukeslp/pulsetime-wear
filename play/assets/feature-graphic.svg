<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title description">
  <title id="title">PulseTime feature graphic</title>
  <desc id="description">Feel the time beside a cyan and amber sequence of tactile pulses.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1b2c"/>
      <stop offset="0.55" stop-color="#0a2434"/>
      <stop offset="1" stop-color="#123743"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fd4ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4fd4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>
  <circle cx="760" cy="250" r="220" fill="url(#glow)"/>

  <g fill="#f8fbff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="150" y="222" font-size="34" font-weight="600" letter-spacing="7">PULSE / TIME</text>
    <text x="146" y="302" font-size="66" font-weight="750" letter-spacing="-2">Feel the time.</text>
  </g>

  <g transform="translate(760 250)">
    <circle r="132" fill="none" stroke="#4fd4ff" stroke-width="13"/>
    <path d="M-88 0 H-58 M58 0 H88" fill="none" stroke="#4fd4ff" stroke-linecap="round" stroke-width="14"/>
    <circle cx="-35" cy="0" r="17" fill="#ffb23d"/>
    <circle cx="9" cy="0" r="17" fill="#ffb23d"/>
    <circle cx="53" cy="0" r="17" fill="#ffb23d"/>
  </g>
</svg>
