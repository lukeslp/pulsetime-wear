# File purpose: Reproducible Gradle defaults for PulseTime Wear.
# Primary components: JVM heap, AndroidX, Kotlin style.
# I/O: Read by Gradle; no runtime application data.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
